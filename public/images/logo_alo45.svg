<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="196"/>
    </clipPath>
  </defs>

  <!-- Anillo exterior verde oscuro -->
  <circle cx="200" cy="200" r="196" fill="#0fa832"/>
  <!-- Círculo interior verde brillante -->
  <circle cx="200" cy="200" r="184" fill="#1CC54E"/>
  <!-- Círculo más brillante interior -->
  <circle cx="200" cy="200" r="176" fill="#22d45a"/>

  <!-- Arco blanco izquierdo (de (40,318) a (40,82) siguiendo el borde) -->
  <path d="M 40 318 A 164 164 0 0 1 40 82"
        fill="none" stroke="white" stroke-width="15" stroke-linecap="round"
        clip-path="url(#circleClip)"/>
  <!-- Arco blanco derecho (espejo) -->
  <path d="M 360 82 A 164 164 0 0 1 360 318"
        fill="none" stroke="white" stroke-width="15" stroke-linecap="round"
        clip-path="url(#circleClip)"/>

  <!-- Sombra del texto "aló" -->
  <text x="195" y="178"
        font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
        font-size="116" font-weight="900"
        fill="#b00418" text-anchor="middle"
        clip-path="url(#circleClip)">aló</text>
  <!-- Texto "aló" -->
  <text x="191" y="172"
        font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
        font-size="116" font-weight="900"
        fill="#E8071A" text-anchor="middle"
        clip-path="url(#circleClip)">aló</text>

  <!-- Rombo / diamante decorativo (arriba derecha de la ó) -->
  <path d="M 300 78 L 313 91 L 300 104 L 287 91 Z" fill="#E8071A"
        clip-path="url(#circleClip)"/>

  <!-- Sombra del texto "45" -->
  <text x="205" y="348"
        font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
        font-size="198" font-weight="900"
        fill="#b00418" text-anchor="middle"
        clip-path="url(#circleClip)">45</text>
  <!-- Texto "45" -->
  <text x="200" y="342"
        font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
        font-size="198" font-weight="900"
        fill="#E8071A" text-anchor="middle"
        clip-path="url(#circleClip)">45</text>
</svg>
