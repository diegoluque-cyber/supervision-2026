<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Sombra exterior -->
  <circle cx="100" cy="103" r="92" fill="rgba(0,0,0,0.18)"/>
  <!-- Círculo verde principal -->
  <circle cx="100" cy="100" r="92" fill="#22C55E"/>
  <!-- Círculo verde interior más claro -->
  <circle cx="100" cy="100" r="86" fill="#16A34A"/>
  <!-- Arco blanco decorativo izquierda -->
  <path d="M 24 130 A 80 80 0 0 1 22 68" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Arco blanco decorativo derecha -->
  <path d="M 176 68 A 80 80 0 0 1 174 132" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- Texto "aló" -->
  <!-- a -->
  <text x="100" y="88" text-anchor="middle" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="46" font-weight="900" fill="#E40721"
        style="letter-spacing:-1px">aló</text>
  <!-- Diamante/acento sobre la ó -->
  <rect x="139" y="44" width="9" height="9" rx="2" fill="#E40721" transform="rotate(45 143.5 48.5)"/>

  <!-- Texto "45" grande -->
  <text x="100" y="148" text-anchor="middle" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="80" font-weight="900" fill="#E40721"
        style="letter-spacing:-3px">45</text>

  <!-- Sombra sutil bajo el texto 45 -->
  <text x="102" y="151" text-anchor="middle" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="80" font-weight="900" fill="rgba(0,0,0,0.15)"
        style="letter-spacing:-3px">45</text>
  <text x="100" y="148" text-anchor="middle" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="80" font-weight="900" fill="#E40721"
        style="letter-spacing:-3px">45</text>
</svg>
